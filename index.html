<style>
:root{
  color-scheme: dark;
  --ink:#0A101C;
  --ink-2:#0F1728;
  --surface:#131D31;
  --line:#243049;
  --line-soft:#1A2438;
  --gold:#D8B066;
  --gold-hi:#F3DFAE;
  --gold-lo:#9C7A3C;
  --text:#ECE7DC;
  --muted:#98A1B3;
  --dim:#6B7489;
  --live:#6FD3A8;
  --display:"Saira Semi Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
html{background:var(--ink)}
body{
  margin:0;background:var(--ink);color:var(--text);
  font-family:var(--body);font-size:15px;line-height:1.5;
  -webkit-font-smoothing:antialiased;
  background-image:
    radial-gradient(120% 60% at 50% -10%, rgba(216,176,102,.16), transparent 60%),
    radial-gradient(80% 40% at 100% 30%, rgba(216,176,102,.05), transparent 70%);
  background-repeat:no-repeat;
  min-height:100%;
}
.wrap{max-width:680px;margin:0 auto;padding-inline:18px;padding-block:0 48px}

/* HERO */
.hero{text-align:center;padding-block:40px 28px;position:relative}
.hero img{width:min(230px,62vw);height:auto;display:block;margin:0 auto 26px;filter:drop-shadow(0 10px 30px rgba(216,176,102,.18))}
.eyebrow{font-family:var(--display);font-weight:500;letter-spacing:.32em;text-transform:uppercase;font-size:12px;color:var(--gold)}
h1{
  font-family:var(--display);font-weight:600;font-size:clamp(34px,9vw,52px);line-height:1.02;
  margin:10px 0 18px;letter-spacing:.01em;text-wrap:balance;
  background:linear-gradient(180deg,var(--gold-hi) 0%,var(--gold) 55%,var(--gold-lo) 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.meta{display:flex;flex-wrap:wrap;justify-content:center;gap:10px}
.meta span{
  display:inline-flex;align-items:center;gap:8px;
  border:1px solid var(--line);border-radius:999px;padding:7px 14px;
  font-size:13.5px;color:var(--text);background:rgba(19,29,49,.6)
}
.meta svg{width:15px;height:15px;stroke:var(--gold);fill:none;stroke-width:1.8}
.rule{height:1px;margin:30px auto 0;max-width:420px;background:linear-gradient(90deg,transparent,var(--gold-lo),transparent)}

/* PREP NOTE */
.prep{
  display:grid;grid-template-columns:auto 1fr;gap:4px 14px;align-items:baseline;
  border:1px dashed var(--line);border-radius:14px;padding:14px 16px;margin-bottom:22px;color:var(--muted);font-size:14px
}
.prep b{font-family:var(--display);font-weight:600;color:var(--gold);letter-spacing:.06em;text-transform:uppercase;font-size:13px}

/* TABS */
.tabs-shell{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;padding-block:10px;margin-inline:-18px;padding-inline:18px;
  background:linear-gradient(var(--ink) 75%,rgba(10,16,28,0))}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:5px;border:1px solid var(--line);border-radius:16px;background:var(--ink-2)}
.tab{
  appearance:none;border:0;background:transparent;color:var(--muted);cursor:pointer;
  border-radius:11px;padding:9px 6px 8px;font-family:var(--display);text-align:center;
  display:flex;flex-direction:column;align-items:center;gap:1px;transition:background .2s,color .2s
}
.tab .d{font-size:22px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.tab .n{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:500}
.tab[aria-selected="true"]{background:linear-gradient(180deg,#E7C882,#B8913F);color:#1A1407}
.tab:focus-visible{outline:2px solid var(--gold-hi);outline-offset:2px}
.tab .today{font-size:9.5px;letter-spacing:.12em;font-weight:600;margin-top:2px}

/* DAY */
.dayhead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin:18px 2px 8px;flex-wrap:wrap}
.dayhead h2{font-family:var(--display);font-weight:600;font-size:22px;margin:0;letter-spacing:.02em}
.dayhead small{color:var(--dim);font-size:13px}

.tl{list-style:none;margin:0;padding:0;position:relative}
.tl::before{content:"";position:absolute;left:67px;top:10px;bottom:10px;width:1px;background:linear-gradient(var(--line),var(--line) 90%,transparent)}
.it{display:grid;grid-template-columns:56px 1fr;gap:0 22px;position:relative;padding-block:10px}
.it::before{content:"";position:absolute;left:63px;top:17px;width:9px;height:9px;border-radius:50%;background:var(--ink);border:1.5px solid var(--gold);z-index:1}
.time{font-family:var(--display);font-variant-numeric:tabular-nums;text-align:right;line-height:1.15;padding-top:6px}
.time .s{font-size:17px;font-weight:600;color:var(--gold-hi);display:block}
.time .e{font-size:12.5px;color:var(--dim);display:block}

.card{background:var(--surface);border:1px solid var(--line-soft);border-radius:14px;padding:12px 15px 13px;min-width:0}
.card h3{margin:0;font-family:var(--display);font-weight:600;font-size:18px;line-height:1.2;letter-spacing:.01em;text-wrap:balance}
.card .sub{color:var(--muted);font-size:13.5px;margin-top:3px}
.tag{display:inline-block;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--gold);margin-bottom:5px;font-family:var(--body)}
.ppl{display:grid;gap:6px;margin-top:10px;padding-top:9px;border-top:1px solid var(--line-soft)}
.p{display:grid;grid-template-columns:92px 1fr;gap:10px;font-size:13.5px;align-items:baseline}
.p .k{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);font-weight:600}
.p .v{color:var(--text);font-weight:500}
.panel{margin-top:8px;display:flex;flex-wrap:wrap;gap:6px}
.panel span{font-size:12.5px;border:1px solid var(--line);border-radius:999px;padding:3px 10px;color:var(--text)}

/* parallel */
.par{display:grid;gap:8px}
.par .card{position:relative}
.par-label{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--gold);margin:6px 0 0 12px}

/* feature (highlight sessions) */
.it.feature .card{background:linear-gradient(160deg,rgba(216,176,102,.14),rgba(19,29,49,1) 55%);border-color:rgba(216,176,102,.35)}
.it.feature::before{background:var(--gold)}

/* quiet rows: breaks & meals */
.it.quiet{padding-block:4px}
.it.quiet::before{width:7px;height:7px;left:64px;top:13px;border-color:var(--dim)}
.it.quiet .time{padding-top:4px}
.it.quiet .time .s{font-size:14.5px;color:var(--muted);font-weight:500}
.it.quiet .time .e{font-size:11.5px}
.it.quiet .card{background:transparent;border:0;padding:4px 0 4px 12px}
.it.quiet h3{font-size:15px;font-weight:500;color:var(--muted);letter-spacing:.02em}
.it.meal h3{color:var(--text)}
.it.meal .tag{color:var(--muted)}

/* live */
.it.now .card{border-color:var(--live);box-shadow:0 0 0 1px var(--live) inset}
.it.now::before{background:var(--live);border-color:var(--live);box-shadow:0 0 0 5px rgba(111,211,168,.18)}
.live{display:inline-flex;align-items:center;gap:6px;font-size:10.5px;font-weight:700;letter-spacing:.14em;color:var(--live);text-transform:uppercase;margin-bottom:5px}
.live i{width:7px;height:7px;border-radius:50%;background:var(--live);animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.live i{animation:none}.tab{transition:none}}

footer{margin-top:36px;text-align:center;color:var(--dim);font-size:13px;display:grid;gap:14px;justify-items:center}
footer a{color:var(--gold);text-decoration:none;border:1px solid var(--line);padding:9px 16px;border-radius:999px;display:inline-flex;gap:8px;align-items:center;font-weight:600;font-size:13.5px}
footer a:focus-visible{outline:2px solid var(--gold-hi);outline-offset:2px}
footer svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8}

@media (max-width:420px){
  .tl::before{left:57px}
  .it{grid-template-columns:48px 1fr;gap:0 18px}
  .it::before{left:53px}
  .it.quiet::before{left:54px}
  .p{grid-template-columns:1fr;gap:1px}
  .card h3{font-size:17px}
}
</style>
</head>

const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const mins=t=>{const[h,m]=t.split(":").map(Number);return h*60+m};

function istanbulNow(){
  try{
    const p=new Intl.DateTimeFormat("en-CA",{timeZone:"Europe/Istanbul",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hourCycle:"h23"}).formatToParts(new Date());
    const g=k=>p.find(x=>x.type===k).value;
    return {date:`${g("year")}-${g("month")}-${g("day")}`,min:+g("hour")*60+ +g("minute")};
  }catch(e){return {date:"",min:-1}}
}

function people(o){
  let h="";
  if(o.sp)h+=`<div class="p"><span class="k">Konuşmacı</span><span class="v">${esc(o.sp)}</span></div>`;
  if(o.m)h+=`<div class="p"><span class="k">${esc(o.mk||"Moderatör / Sorumlu")}</span><span class="v">${esc(o.m)}</span></div>`;
  if(o.panel)h+=`<div class="p"><span class="k">Panelistler</span><span class="v"><span class="panel">${o.panel.map(n=>`<span>${esc(n)}</span>`).join("")}</span></span></div>`;
  return h?`<div class="ppl">${h}</div>`:"";
}
function card(o,live){
  return `<div class="card">${live?'<div class="live"><i></i>Şu an</div>':""}${o.tag?`<div class="tag">${esc(o.tag)}</div>`:""}<h3>${esc(o.t)}</h3>${o.sub?`<div class="sub">${esc(o.sub)}</div>`:""}${people(o)}</div>`;
}

let current=0;
function render(i){
  current=i;
  const day=DAYS[i], now=istanbulNow(), isToday=now.date===day.date;
  document.querySelectorAll(".tab").forEach((b,k)=>b.setAttribute("aria-selected",k===i?"true":"false"));
  const rows=day.items.map(o=>{
    let e=mins(o.e); if(e===0)e=1440;
    const live=isToday && now.min>=mins(o.s) && now.min<e;
    const cls=["it",o.q?"quiet":"",o.meal?"meal":"",o.f?"feature":"",live?"now":""].join(" ");
    const time=`<div class="time"><span class="s">${o.s}</span><span class="e">${o.e}</span></div>`;
    let body;
    if(o.par){
      body=`<div class="par"><div class="par-label">Paralel oturumlar</div>${o.par.map(p=>card(p,live)).join("")}</div>`;
    }else if(o.q){
      body=`<div class="card">${live?'<div class="live"><i></i>Şu an</div>':""}<h3>${esc(o.t)}</h3></div>`;
    }else body=card(o,live);
    return `<li class="${cls}">${time}${body}</li>`;
  }).join("");
  document.getElementById("day").innerHTML=
    `<div class="dayhead"><h2>${esc(day.title)}</h2><small>${esc(day.note)}</small></div><ol class="tl">${rows}</ol>`;
}

const tabs=document.getElementById("tabs");
const today=istanbulNow().date;
tabs.innerHTML=DAYS.map((d,i)=>`<button class="tab" role="tab" id="tab-${d.id}" aria-selected="false" data-i="${i}"><span class="d">${d.d}</span><span class="n">${d.n}</span>${d.date===today?'<span class="today">BUGÜN</span>':""}</button>`).join("");
tabs.addEventListener("click",e=>{
  const b=e.target.closest(".tab"); if(!b)return;
  render(+b.dataset.i);
  try{history.replaceState(null,"","#"+DAYS[+b.dataset.i].id)}catch(_){}
});

let start=DAYS.findIndex(d=>d.date===today);
const h=(location.hash||"").slice(1);
const hi=DAYS.findIndex(d=>d.id===h);
if(hi>=0)start=hi;
if(start<0)start=today>DAYS[2].date?2:0;
render(start);
setInterval(()=>render(current),60000);
</script>
